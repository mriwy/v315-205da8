<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valencia 3:15 — Today</title>
<meta name="theme-color" content="#0F1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valencia 3:15">
<style>
:root{color-scheme:dark;
 --bg:#0F1420;--surface:#161C2A;--surface2:#1E2636;--line:#2A3346;
 --ink:#E6EAF2;--gray:#A3ADBF;--muted:#78849A;
 --brand:#8FB3E8;--brandSolid:#1B2440;--primaryBg:#2E4A7D;--onBrand:#FFFFFF;
 --blue:#5AA9D6;--orange:#F0873F;
 --tint:#152234;--otint:#2A1D14;--guideBg:#231A12;
 --g:#4CAF50;--a:#E8A100;--r:#EF5350;
 --gbg:#14301A;--abg:#332608;--rbg:#331615;--gtx:#8BD98F;--atx:#F0C266;--rtx:#F19B98;
 --heroTxt:#DCE6F5}
[data-theme="light"]{color-scheme:light;
 --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F2F5F8;--line:#E2E8F0;
 --ink:#222830;--gray:#5A6470;--muted:#8A93A0;
 --brand:#21295C;--brandSolid:#21295C;--primaryBg:#21295C;--onBrand:#FFFFFF;
 --blue:#065A82;--orange:#D9642A;
 --tint:#E9F1F5;--otint:#FBEFE6;--guideBg:#FFF9F5;
 --g:#2E7D32;--a:#E8A100;--r:#C62828;
 --gbg:#E8F5E9;--abg:#FFF4D6;--rbg:#FDECEA;--gtx:#1B5E20;--atx:#7A5200;--rtx:#8E1B1B;
 --heroTxt:#21295C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:18px;color:var(--brand);font-weight:600;letter-spacing:.2px}
.brand b span{color:var(--orange)}
.brand small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;color:var(--ink);font-size:13px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primaryBg);color:var(--onBrand);border-color:var(--primaryBg)}
.btn.primary:disabled{opacity:.55;cursor:default}
select.btn{padding:6px 8px}
.hidden{display:none!important}

.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.weeknav .lbl{font-size:13px;color:var(--gray)}
.weeknav .lbl b{color:var(--ink);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;text-align:center;background:var(--surface);position:relative;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.day .dn{font-size:16px;font-weight:600;color:var(--ink);line-height:1}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day.past{background:var(--surface2);border-color:transparent}
.day.past .dn{color:var(--gray)}
.day.today{border:2px solid var(--brand);background:var(--surface)}
.day.today .dn{color:var(--brand)}
.day.sel{outline:2px solid var(--orange);outline-offset:1px}
.day.quality .dw{color:var(--orange)}
.day .cp{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--a)}
.day:hover{background:var(--tint)}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.rail{position:sticky;top:12px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card+.card{margin-top:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead h1{margin:0;font-size:20px;font-weight:600;color:var(--brand)}
.dhead .meta{font-size:13px;color:var(--gray)}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--gray);font-weight:600;letter-spacing:.2px}
.chip.q{background:var(--otint);color:var(--orange)}
.chip.rest{background:var(--tint);color:var(--blue)}
.chip.g{background:var(--gbg);color:var(--gtx)}.chip.a{background:var(--abg);color:var(--atx)}.chip.r{background:var(--rbg);color:var(--rtx)}
.chip.race{background:var(--primaryBg);color:var(--onBrand)}

.hero{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--tint)}
.hero.quality{background:var(--otint)}
.hero.race{background:var(--brandSolid)}
.hero .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue);font-weight:600}
.hero.quality .k{color:var(--orange)}
.hero.race .k{color:#F4B183}
.hero .t{font-size:17px;font-weight:600;margin:4px 0 6px;color:var(--heroTxt)}
.hero.race .t{color:#FFFFFF}
.hero .sub{font-size:14px;color:var(--gray)}
.hero.race .sub{color:#CADCFC}
.hero .kv div b{color:var(--ink)}
.hero.race .kv div,.hero.race .kv div b{color:#DCE6F5}
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px;font-size:13.5px}
.gym{margin-top:10px;border-radius:12px;padding:12px 16px;background:var(--surface2);font-size:14px}
.gym .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:600;margin-bottom:2px}

.sec{margin-top:14px}
.sec h2{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600}
.sec p{margin:0;font-size:14.5px;color:var(--ink)}
.guide{border-left:3px solid var(--orange);padding:8px 12px;background:var(--guideBg);border-radius:0 10px 10px 0;margin-top:8px;font-size:14px}
.guide b{color:var(--orange)}
.guide .row{display:grid;grid-template-columns:90px 1fr;gap:6px;margin:4px 0}
.guide .row span:first-child{color:var(--gray);font-size:12.5px}
.quote{border-left:3px solid var(--brand);padding:8px 12px;background:var(--tint);border-radius:0 10px 10px 0;margin-top:8px;font-size:14px;color:var(--ink)}
.quote .who{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);font-weight:600;margin-bottom:2px}
/* == cmt-render begin == */
.quote .cmt-b{margin-top:9px}
.quote .cmt-b:first-child{margin-top:3px}
.quote .cmt-b+.cmt-b{border-top:1px solid var(--line);padding-top:9px}
.quote .cmt-who{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
 letter-spacing:.7px;padding:2px 8px;border-radius:999px;margin-bottom:6px;
 background:var(--surface2);color:var(--gray);border:1px solid var(--line)}
.quote .cmt-who.panel{color:var(--brand);border-color:var(--brand)}
.quote .cmt-who.szost{color:var(--orange);border-color:var(--orange)}
.quote .cmt-who.physio{color:var(--blue);border-color:var(--blue)}
.quote .cmt-who.hansons{color:var(--g);border-color:var(--g)}
.quote .cmt-b p{margin:0 0 7px;line-height:1.62}
.quote .cmt-b p:last-child{margin-bottom:0}
.quote .lead{font-weight:700;color:var(--ink)}
.quote ol.cmt-num{margin:5px 0 8px;padding-left:22px}
.quote ol.cmt-num li{margin-bottom:7px;line-height:1.62}
.quote ol.cmt-num li:last-child{margin-bottom:0}
.quote ol.cmt-num li::marker{color:var(--brand);font-weight:700}
/* == cmt-render end == */
.supp{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.supp .sl{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.supp .sl:first-child{border-top:0}
.supp .sl .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--blue);line-height:1.25}
.supp .sl .tm em{display:block;font-style:normal;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
.supp .sl.key{background:var(--guideBg)}
.supp .sl.key .tm{color:var(--orange)}
.supp .it{font-size:14.5px}
.supp .it+.it{margin-top:7px}
.supp .it b{font-weight:600}
.supp .it .ds{color:var(--gray)}
.supp .it .nt{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.supp .base{padding:10px 14px;border-top:1px solid var(--line);background:var(--surface2);font-size:13.5px;color:var(--gray)}
.supp .base b{color:var(--ink);font-weight:600}
.suppfoot{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.45}
@media(max-width:560px){.supp .sl{grid-template-columns:62px 1fr;gap:9px;padding:9px 11px}}

.live{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.live .st{font-size:12.5px;color:var(--muted)}
.live table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.live td{padding:4px 0;border-top:1px solid var(--line);color:var(--gray)}
.live td:last-child{text-align:right;font-weight:600;color:var(--ink)}
.actual{font-size:14px;margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.fb textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--surface2);color:var(--ink)}
.fb textarea::placeholder{color:var(--muted)}
.fb textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.fb .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.fb label{font-size:12px;color:var(--gray);display:block;margin-bottom:3px}
.fb input,.fb select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--surface2);color:var(--ink)}
.fb .act{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.fb .msg{font-size:13px}
.fb .msg.ok{color:var(--g)}.fb .msg.err{color:var(--r)}
.lock{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock p{margin:0;font-size:13.5px;color:var(--gray);flex:1 1 220px}
.lock input{flex:1 1 160px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface2);color:var(--ink)}
.relock{font-size:12px;color:var(--muted);margin-left:auto;cursor:pointer;background:none;border:0;text-decoration:underline}

.rail .card{padding:14px 16px}
.rail h3{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600}
.big{font-size:22px;font-weight:600;color:var(--brand)}
.big small{font-size:13px;color:var(--gray);font-weight:400}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:64px;margin-top:8px}
.bars .b{position:relative;background:var(--surface2);border-radius:4px 4px 0 0;height:100%}
.bars .b i{position:absolute;bottom:0;left:0;right:0;background:var(--brand);border-radius:4px 4px 0 0}
.bars .b.q i{background:var(--orange)}
.bars .b em{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-style:normal;margin-top:3px}
.cpl{list-style:none;margin:0;padding:0;font-size:13.5px}
.cpl li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.cpl li:first-child{border-top:0}
.cpl .d{color:var(--gray);min-width:52px;font-variant-numeric:tabular-nums}
.cpl li.next .d{color:var(--orange);font-weight:600}
details summary{cursor:pointer;font-size:13px;color:var(--blue);list-style:none;margin-top:6px}
details summary::-webkit-details-marker{display:none}
.pz{font-size:12.5px;margin-top:8px}
.pz div{padding:6px 0;border-top:1px solid var(--line)}
.pz b{display:block;color:var(--brand)}
.pz span{color:var(--gray)}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="brand"><b>VALENCIA <span>3:15</span></b><small id="countdown"></small></div>
  <div class="tools">
   <select id="jump" class="btn" aria-label="Jump to week"></select>
   <button class="btn" id="todayBtn">Today</button>
   <button class="btn" id="themeBtn" aria-label="Toggle light or dark theme">Light</button>
   <button class="btn hidden" id="langBtn" aria-label="Language">PL</button>
   <a class="btn" id="glanceBtn" href="glance/" aria-label="Plan at a glance">Glance</a>
  </div>
 </header>

 <div class="weeknav">
  <button class="btn" id="prevW" aria-label="Previous week">‹</button>
  <div class="lbl" id="weekLbl"></div>
  <button class="btn" id="nextW" aria-label="Next week">›</button>
 </div>
 <div class="strip" id="strip"></div>

 <div class="grid">
  <main id="main"></main>
  <aside class="rail" id="rail"></aside>
 </div>
 <div class="foot" id="foot"></div>
</div>

// Panel-comment renderer for the Valencia training pages.
// Source of truth for the snippet injected into index.html / mike-index.html.
// Kept here so the transform can be re-applied or tested; see PUBLISHING.md.
//
// Turns one long comment string into speaker blocks + paragraphs + lists.
// Purely presentational: it never changes the words, only how they are grouped.

function cmtEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Only a fixed roster starts a new speaker block. Generic "Something:" lead-ins
// are treated as emphasis, not as a new panellist.
var CMT_ROSTER='Panel|Szost|Physiologist|Hansons coach|Hansons|Athlete note|Coach';
var CMT_WHO=new RegExp('(?:^|[.!?:;)\\]]\\s+|\\|\\s*|\\n\\s*)('+CMT_ROSTER+')((?:\\s*\\([^)]{0,40}\\))?)\\s*:\\s','gi');
// ALL-CAPS lead-in at the start of a sentence, e.g. "ON THE WALKING:", "FUEL —".
// Polish capitals (ĄĆĘŁŃÓŚŹŻ) included since 2026-10-25 — comments are now written with diacritics.
var CMT_LEAD=/^([A-ZĄĆĘŁŃÓŚŹŻ][A-Z0-9ĄĆĘŁŃÓŚŹŻ '&\/+.-]{2,45}(?:\([^)]{0,40}\))?)(\s*[:—]\s*)/;

var CMT_SEP=String.fromCharCode(1);
function cmtSentences(t){
  // Lookahead only (no lookbehind) so older Safari/iOS keeps working.
  return t.replace(/([.!?])\s+(?=[A-ZÀ-ÝĄĆĘŁŃŚŹŻ(“"'\d])/g,'$1'+CMT_SEP).split(CMT_SEP)
          .map(function(s){return s.trim();}).filter(Boolean);
}

// Group a run of prose into paragraphs of ~2 sentences, breaking early on lead-ins.
function cmtPushProse(text,out){
  var sents=cmtSentences(text), buf=[];
  sents.forEach(function(s){
    if(CMT_LEAD.test(s) && buf.length){ out.push({t:'p',text:buf.join(' ')}); buf=[]; }
    buf.push(s);
    if(buf.length>=2){ out.push({t:'p',text:buf.join(' ')}); buf=[]; }
  });
  if(buf.length) out.push({t:'p',text:buf.join(' ')});
}

// Split a block body into renderable items ({t:'p'} or {t:'ol'}).
// Numbered runs are pulled out at CHUNK level — doing it after sentence grouping
// would strand item (1) in an earlier paragraph.
function cmtParas(body){
  var chunks=body.split(/\s*\|\s*|\n+/).map(function(s){return s.trim();}).filter(Boolean);
  var out=[];
  chunks.forEach(function(chunk){
    var n=cmtNumbered(chunk);
    if(n){
      if(n.intro) cmtPushProse(n.intro,out);
      out.push({t:'ol',items:n.items});
      if(n.tail) cmtPushProse(n.tail,out);
    } else {
      cmtPushProse(chunk,out);
    }
  });
  return out;
}

// Pull "(1) … (2) … (3) …" runs out of a paragraph into an ordered list.
function cmtNumbered(p){
  var parts=p.split(/\s*\((\d)\)\s*/);
  if(parts.length<5) return null;            // need at least two items
  var intro=parts[0].trim(), items=[];
  for(var i=1;i<parts.length;i+=2) items.push((parts[i+1]||'').trim());
  items=items.filter(Boolean);

  // The final item runs to the end of the chunk, so it would otherwise swallow any
  // prose that follows the enumeration. A new capitalised lead-in ends the list.
  var tail='';
  if(items.length){
    var last=cmtSentences(items[items.length-1]), cut=-1;
    for(var j=1;j<last.length;j++){ if(CMT_LEAD.test(last[j])){ cut=j; break; } }
    if(cut>0){
      items[items.length-1]=last.slice(0,cut).join(' ');
      tail=last.slice(cut).join(' ');
    }
  }
  return {intro:intro, items:items, tail:tail};
}

function cmtInline(s){
  var m=s.match(CMT_LEAD);
  // m[1] can capture a trailing space (the char class allows spaces) — trim it
  // back out so the bold run ends on the word, not on whitespace.
  if(m){
    var head=m[1].replace(/\s+$/,''), gap=m[1].slice(head.length);
    return '<b class="lead">'+head+'</b>'+gap+m[2]+s.slice(m[0].length);
  }
  return s;
}

function cmtPara(item){
  if(item.t==='ol'){
    return '<ol class="cmt-num">'+item.items.map(function(it){
             return '<li>'+cmtInline(it)+'</li>';}).join('')+'</ol>';
  }
  return '<p>'+cmtInline(item.text)+'</p>';
}

function fmtComment(raw){
  var txt=cmtEsc(raw).replace(/\s+/g,' ').trim();
  if(!txt) return '';

  // Locate speaker-block starts.
  var marks=[], m;
  CMT_WHO.lastIndex=0;
  while((m=CMT_WHO.exec(txt))!==null){
    marks.push({at:m.index+m[0].indexOf(m[1]), end:m.index+m[0].length,
                who:m[1]+(m[2]||'')});
  }

  var blocks=[];
  if(!marks.length || marks[0].at>0){
    blocks.push({who:null, body:txt.slice(0, marks.length?marks[0].at:txt.length).trim()});
  }
  marks.forEach(function(mk,i){
    var stop=(i+1<marks.length)?marks[i+1].at:txt.length;
    blocks.push({who:mk.who, body:txt.slice(mk.end, stop).trim()});
  });

  return blocks.filter(function(b){return b.body;}).map(function(b){
    // "Panel: session delivered…" loses its colon to the chip, which would leave the
    // sentence starting lower-case. Restore the capital (letters only — never touch a
    // block opening on a number like "~30 W" or "4:43/km").
    var body=b.body;
    if(b.who && /^[a-ząćęłńóśźż]/.test(body)) body=body.charAt(0).toUpperCase()+body.slice(1);
    var inner=cmtParas(body).map(cmtPara).join('');
    var key=(b.who||'').toLowerCase().replace(/[^a-z]/g,'');
    var cls=/szost/.test(key)?'szost':/physio/.test(key)?'physio':
            /hansons/.test(key)?'hansons':/athlete/.test(key)?'athlete':'panel';
    return '<div class="cmt-b">'+
           (b.who?'<span class="cmt-who '+cls+'">'+b.who+'</span>':'')+
           inner+'</div>';
  }).join('');
}
/* cmt-render js end */

const days = DATA.days;
const byDate = Object.fromEntries(days.map(d=>[d.date,d]));
const first = days[0].date, last = days[days.length-1].date;
const iso = d => d.toISOString().slice(0,10);
const todayISO = (()=>{const n=new Date();return iso(new Date(n.getFullYear(),n.getMonth(),n.getDate(),12));})();
const clamp = s => s<first?first:(s>last?last:s);
let sel = clamp(todayISO);
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const mondayOf=s=>{const d=new Date(s+'T12:00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);};
const fmtLong=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const isQuality=d=>/hill|strength|MP|ladder|x \d|interval|TIME-TRIAL|HALF MARATHON|RACE DAY|progressive|race simulation/i.test(d.run) && !/^rest|^—|^no /i.test(d.run);
const isRest=d=>/^rest|^—$|^—\s|no run|no training|TRACK DAY|travel/i.test(d.run) || d.run==='' ;
const ragClass=r=>r==='GREEN'?'g':r==='AMBER'?'a':r==='RED'?'r':'';
const cpMap=Object.fromEntries(DATA.checkpoints.map(c=>[c.date,c.label]));
const daysTo=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);

const cache={list:{},perf:{},week:{}};
const bridge=()=>window.cowork && typeof window.cowork.callMcpTool==='function';
async function mcp(name,args){const r=await window.cowork.callMcpTool(name,args);if(r&&r.isError)throw new Error('tool error');return r.structuredContent ?? JSON.parse(r.content[0].text);}
async function listDay(date){ if(cache.list[date])return cache.list[date];
 const res=await mcp(STRAVA_LIST,{range_start:date+'T00:00:00',range_end:date+'T23:59:59',first:20});
 cache.list[date]=res.activities||[];return cache.list[date];}
async function perf(id){ if(cache.perf[id])return cache.perf[id]; cache.perf[id]=await mcp(STRAVA_PERF,{activity_id:String(id)}); return cache.perf[id];}
async function weekActual(mon){ if(cache.week[mon])return cache.week[mon];
 const res=await mcp(STRAVA_LIST,{range_start:mon+'T00:00:00',range_end:addDays(mon,6)+'T23:59:59',first:60});
 const per={};for(const a of (res.activities||[])){if(a.sport_type!=='Run')continue;const d=a.start_local.slice(0,10);per[d]=(per[d]||0)+(a.summary?.distance||0)/1000;}
 cache.week[mon]=per;return per;}
const pace=(m,s)=>{if(!m||!s)return'—';const spk=s/(m/1000);const mm=Math.floor(spk/60),ss=Math.round(spk%60);return `${mm}:${String(ss).padStart(2,'0')}/km`;};
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;};

function guidanceFor(d){
 const r=d.run, out=[];
 const pick=k=>{const row=DATA.paces.find(p=>p.session.toLowerCase().includes(k.toLowerCase()));if(row&&!out.includes(row))out.push(row);};
 if(/hill/i.test(r))pick('Hill');
 if(/STRENGTH|sharpener/i.test(r))pick('Hansons STRENGTH');
 if(/ladder/i.test(r)){pick('Marathon pace');pick('Ladder floats');}
 else if(/\bMP\b/.test(r)&&!/STRENGTH/i.test(r))pick('Marathon pace');
 if(/x \d.*@ 4:[0-2]/.test(r)&&!/STRENGTH|sharpener/i.test(r)&&!/hill/i.test(r))pick('Intervals');
 if(/HALF MARATHON|HM pace/i.test(r))pick('Half-marathon');
 if(/strides/i.test(r))pick('Strides');
 if(/long run|\d{2}km long|race simulation|progressive/i.test(r))pick('Long runs');
 if(/easy|shakeout|taper run/i.test(r)&&!/long/i.test(r))pick('Easy runs');
 if(/^RACE DAY/i.test(r))DATA.paces.filter(p=>/Race day/i.test(p.session)).forEach(p=>out.push(p));
 return out;
}

/* ---------- supplement protocol ---------- */
const _hm=(h,m)=>String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
const _shift=(hm,mins)=>{const p=hm.split(':');let x=(+p[0])*60+(+p[1])+mins;x=((x%1440)+1440)%1440;return _hm(Math.floor(x/60),x%60);};

function sessionPlan(d){
 const rest=isRest(d), race=/RACE DAY/i.test(d.run||'');
 const gymRaw=(d.gym||'').trim();
 const gymTxt=(gymRaw&&!/^—/.test(gymRaw))?gymRaw:'';
 const hasGym=!!gymTxt&&!/optional|mobility|activation/i.test(gymTxt);
 const am=/\bAM\b|before breakfast|morning/i.test(d.run||'');
 const longRun=/long run|race simulation|progressive|long$/i.test(d.run||'')||(d.dow==='Sun'&&(d.km||0)>=15);
 let start=null;
 if(race)start='08:15';
 else if(rest&&!hasGym)start=null;
 else if(d.dow==='Mon')start='08:00';
 else if(d.dow==='Sat')start='10:00';
 else if(d.dow==='Sun')start='09:00';
 else start=am?'07:00':'19:00';
 const gymOnly=hasGym&&(rest||!d.run||d.run==='—');
 const morning=start?(+start.slice(0,2))<12:false;
 return {start,rest,hasGym,gymOnly,race,longRun,morning};
}

function suppFor(d){
 const s=sessionPlan(d), rows=[], notes=[];
 const runCore=(d.run||'').replace(/\+?\s*\d+\s*x\s*\d+\s*m?\s*strides?/ig,'');
 const hardRun=/hill|STRENGTH|\bMP\b|ladder|interval|TIME-TRIAL|HALF MARATHON|race simulation|progressive|x\s?\d+\s?km/i.test(runCore);
 const loads=s.hasGym||hardRun||s.longRun;
 const heavy=/heavy/i.test(d.gym||'');
 const collagen=!!s.start&&loads&&!s.race;
 const colT=collagen?_shift(s.start,-60):null;
 const colAM=!!colT&&(+colT.slice(0,2))<12;
 const mins=hm=>{const p=hm.split(':');return (+p[0])*60+(+p[1]);};

 /* first meal of the day — D3/K2/omega-3 need fat. On a long morning run it
    moves to the post-run meal, because he does not eat a full breakfast first. */
 const d3InPost=s.longRun&&s.morning;
 let bfast=null;
 if(!d3InPost){
  if(colAM)bfast=_shift(colT,15);
  else if(s.morning)bfast=_shift(s.start,-90);
  else bfast='07:30';
 }
 if(bfast)rows.push({time:bfast,tag:t('suMorn'),key:false,
  items:[{n:t('suD3'),d:'',note:t('suD3N')+(colAM?' '+t('suD3After'):'')}]});

 if(collagen){
  rows.push({time:colT,tag:t('suPre'),key:heavy,
   items:[{n:t('suCol'),d:t('suColD'),note:(colAM?t('suColAM'):t('suColPM'))+(heavy?' '+t('suColKey'):'')}]});
 }
 if(s.start){
  const dur=s.race?210:(s.longRun?120:((s.gymOnly&&s.morning)?75:90));
  const it=[];
  if(s.morning&&!s.race)it.push({n:t('suWhey'),d:t('suWheyD'),note:t('suWheyN')});
  it.push({n:t('suCre'),d:t('suCreD'),note:s.morning&&!s.race?'':t('suCreN')});
  if(d3InPost)it.push({n:t('suD3'),d:'',note:t('suD3N')+' '+t('suD3Run')});
  rows.push({time:_shift(s.start,dur),tag:t('suPost'),key:false,items:it});
 }else{
  rows.push({time:t('suNoT'),tag:t('suAny'),key:false,sortAt:720,
   items:[{n:t('suCre'),d:t('suCreD'),note:t('suCreN')}]});
 }
 rows.push({time:'22:30',tag:t('suBed'),key:false,items:[
  {n:t('suCas'),d:t('suCasD'),note:t('suCasN')},
  {n:t('suMag'),d:t('suMagD'),note:t('suMagN')}]});

 rows.forEach(r=>{if(typeof r.sortAt!=='number')r.sortAt=mins(r.time);});
 rows.sort((a,b)=>a.sortAt-b.sortAt);

 if(!collagen&&s.start&&!s.race)notes.push(t('suNoCol'));
 if(!s.start)notes.push(t('suRestN'));
 if(s.start&&!s.morning&&!s.race)notes.push(t('suNoCaf'));
 if(s.longRun&&!s.race)notes.push(t('suFuel'));
 if(/ladder|\bMP\b/i.test(d.run||'')&&!s.race)notes.push(t('suGel'));
 if(d.date>='2026-12-03'&&d.date<='2026-12-05')notes.push(t('suLoad'));
 if(s.race)notes.push(t('suRace'));
 notes.push(t('suGone'));
 return {rows,notes};
}

 try{const acts=await listDay(date);
  if(date!==sel)return;
  const runs=acts.filter(a=>a.sport_type==='Run'&&(a.summary?.distance||0)>200);
  const others=acts.filter(a=>a.sport_type!=='Run');
  if(!acts.length){box.innerHTML=`<div class="st">${t('liveNone')}</div>`;return;}
  let h='';
  for(const a of runs){let p=null;try{p=await perf(a.id);}catch(e){}
   const s=a.summary||{};
   h+=`<div style="font-weight:600;margin-top:6px">${a.name}</div><table>
    <tr><td>${t('dist')}</td><td>${(s.distance/1000).toFixed(2)} km</td></tr>
    <tr><td>${t('time')}</td><td>${hms(s.moving_time)}</td></tr>
    <tr><td>${t('avgPace')}</td><td>${pace(s.distance,s.moving_time)}</td></tr>
    ${p&&p.average_heartrate?`<tr><td>${t('hr')}</td><td>${Math.round(p.average_heartrate)} / ${p.max_heartrate}</td></tr>`:''}
    ${(p&&p.average_cadence)||s.avg_cadence?`<tr><td>${t('cad')}</td><td>${Math.round(((p&&p.average_cadence)||s.avg_cadence)*2)} spm</td></tr>`:''}
    ${s.elevation_gain?`<tr><td>${t('elev')}</td><td>${Math.round(s.elevation_gain)} m</td></tr>`:''}
    ${s.relative_effort?`<tr><td>${t('re')}</td><td>${s.relative_effort}</td></tr>`:''}
   </table>`;}
  for(const a of others){const s=a.summary||{};h+=`<div style="margin-top:8px;font-size:13.5px"><b>${a.name}</b> · ${a.sport_type} · ${hms(s.moving_time||0)}${s.distance?` · ${(s.distance/1000).toFixed(1)} km`:''}</div>`;}
  box.innerHTML=h||`<div class="st">${t('liveNone')}</div>`;
 }catch(e){box.innerHTML=`<div class="st">${t('liveOff')}</div>`;console.warn('live',e);}
}

// Three tiers: async clipboard -> execCommand -> a selectable box.
// Some browsers block both clipboard paths, so the last tier must always work.
async function doCopy(text,msg){
 const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
   ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
   ta.focus();ta.select();ta.setSelectionRange(0,text.length);
   const r=document.execCommand('copy');document.body.removeChild(ta);return r;}catch(e){return false;}};
 let ok=false;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch(e){ok=false;}
 if(!ok)ok=legacy();
 if(ok){msg.textContent=t('copied');msg.classList.add('ok');return;}
 let box=document.getElementById('fbOut');
 if(!box){box=document.createElement('textarea');box.id='fbOut';box.readOnly=true;box.style.marginTop='8px';
  document.getElementById('fbSend').closest('.act').insertAdjacentElement('afterend',box);}
 box.value=text;box.style.display='block';box.focus();box.select();
 msg.textContent=t('copyFail');msg.classList.add('ok');
}

async function sendFeedback(copyMode){
 const txt=document.getElementById('fbText').value.trim(); const msg=document.getElementById('fbMsg'); const btn=document.getElementById('fbSend');
 msg.className='msg';
 if(!txt){msg.textContent=t('empty');msg.classList.add('err');return;}
 const d=byDate[sel]; const now=new Date(); const hhmm=String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
 const rpe=document.getElementById('fbRpe').value, sl=document.getElementById('fbSleep').value, hrv=document.getElementById('fbHrv').value, rhr=document.getElementById('fbRhr').value, w=document.getElementById('fbW').value, al=document.getElementById('fbAlc').value;
 const body=[`Date: ${sel} (${d.dow}) · ${d.week} · ${d.phase}`,`Planned: ${d.run}${d.pace?' @ '+d.pace:''}${d.gym&&d.gym!=='—'?' | Gym: '+d.gym:''}`,
  rpe?`RPE: ${rpe}`:'',sl?`Sleep: ${sl} h`:'',hrv?`HRV: ${hrv} ms`:'',rhr?`RHR: ${rhr} bpm`:'',w?`Weight: ${w} kg`:'',al?`Alcohol: ${al}`:'',``,`Note:`,txt,``,`Sent: ${now.toISOString()}`].filter(x=>x!==null).join('\n');
 if(copyMode){await doCopy(body,msg);return;}
 if(!bridge()){
  try{const subj=encodeURIComponent(`[Valencia feedback] ${sel} ${d.dow} — ${d.week}`);const bodyEnc=encodeURIComponent(body);
   const gurl='https://mail.google.com/mail/?view=cm&fs=1&to=mr.dominator%40gmail.com&su='+subj+'&body='+bodyEnc;const win=window.open(gurl,'_blank','noopener');if(!win){msg.textContent=t('mailFail');msg.classList.add('err');return;}msg.textContent=t('mailOpen');msg.classList.add('ok');}
  catch(e){msg.textContent=t('mailFail');msg.classList.add('err');}
  return;
 }
 btn.disabled=true;msg.textContent=t('sending');
 try{await mcp(DRIVE_CREATE,{title:`${sel}_${hhmm}_feedback.txt`,parentId:DATA.feedbackFolderId,contentMimeType:'text/plain',disableConversionToGoogleType:true,textContent:body});
  msg.textContent=t('sent');msg.classList.add('ok');document.getElementById('fbText').value='';
 }catch(e){msg.textContent=t('fail');msg.classList.add('err');console.error('feedback',e);}
 btn.disabled=false;
}

async function renderRail(){
 const rail=document.getElementById('rail'); const mon=mondayOf(sel);
 const wd=[...Array(7)].map((_,i)=>byDate[addDays(mon,i)]).filter(Boolean);
 const planned=wd.reduce((a,d)=>a+(d.km||0),0);
 const nextCp=DATA.checkpoints.find(c=>c.date>=todayISO);
 const alcDays=days.filter(d=>d.date>=DATA.blockStart&&d.date<=todayISO&&d.alcohol.toLowerCase()==='none').length;
 rail.innerHTML=`<div class="card"><h3>${t('thisWeek')}</h3><div class="big"><span id="wkAct">…</span> <small>${t('of')} ${Math.round(planned)} ${t('kmU')} ${t('planned')}</small></div>
   <div class="bars" id="bars">${wd.map(d=>`<div class="b ${isQuality(d)?'q':''}" title="${d.dow}: ${d.km||0} km planned"><i style="height:0%"></i><em>${d.dow.slice(0,2)}</em></div>`).join('')}</div><div style="height:14px"></div></div>
  <div class="card"><h3>${t('checkpoints')}</h3><ul class="cpl">${DATA.checkpoints.map(c=>`<li class="${nextCp&&c.date===nextCp.date?'next':''}"><span class="d">${fmtShort(c.date)}</span><span>${c.label}</span></li>`).join('')}</ul></div>
  <div class="card"><h3>${t('weightT')}</h3><div class="big">${DATA.weight.last} <small>kg · ${t('lastKnown')} ${fmtShort(DATA.weight.lastDate)}</small></div><div style="font-size:13px;color:var(--gray)">${t('target')} ${DATA.weight.target} kg ${t('by')} ${fmtShort(DATA.weight.targetDate)}</div>
   <div style="margin-top:10px;font-size:13px;color:var(--gray)">${t('alcStreak')}: <b style="color:var(--g)">${alcDays}</b></div></div>
  <div class="card"><details><summary>${t('pz')}</summary><div class="pz">${DATA.paces.map(p=>`<div><b>${p.session}</b><span>${p.pace}${p.hr?' · '+p.hr:''}${p.cad?' · '+p.cad:''}</span><br><span>${p.notes}</span></div>`).join('')}</div></details></div>`;
 const maxKm=Math.max(...wd.map(d=>d.km||0),1);
 const bars=[...document.querySelectorAll('#bars .b i')];
 if(!bridge()){document.getElementById('wkAct').textContent=Math.round(planned);wd.forEach((d,i)=>{bars[i].style.height=(d.km/maxKm*100)+'%';bars[i].style.opacity=.55;});return;}
 try{const per=await weekActual(mon); let sum=0;
  wd.forEach((d,i)=>{const a=per[d.date]||0;sum+=a;const plannedH=(d.km/maxKm*100);const actH=Math.min(100,(a/maxKm*100));
   bars[i].style.height=actH+'%'; if(a===0&&d.date>=todayISO){bars[i].style.height=plannedH+'%';bars[i].style.opacity=.25;}});
  document.getElementById('wkAct').textContent=sum.toFixed(1);
 }catch(e){document.getElementById('wkAct').textContent='—';}
}

function renderJump(){
 const j=document.getElementById('jump'); const seen=new Map();
 for(const d of days){if(!seen.has(d.week))seen.set(d.week,d.date);}
 j.innerHTML=[...seen].map(([w,ds])=>`<option value="${ds}">${w} · ${fmtShort(ds)}</option>`).join('');
 j.value=[...seen].find(([w])=>w===byDate[sel]?.week)?.[1]||days[0].date;
 j.onchange=()=>{sel=j.value;render();};
}

function render(){
 const dtr=daysTo(todayISO,DATA.race);
 document.getElementById('countdown').textContent=dtr>0?`${dtr} ${t('daysToRace')}`:(dtr===0?t('raceDay'):'');
 document.getElementById('foot').textContent=t('foot');
 renderStrip(); renderMain(); renderRail(); renderJump();
 document.getElementById('todayBtn').textContent=t('today');
}
document.getElementById('prevW').onclick=()=>{sel=clamp(addDays(sel,-7));render();};
document.getElementById('nextW').onclick=()=>{sel=clamp(addDays(sel,7));render();};
document.getElementById('todayBtn').onclick=()=>{sel=clamp(todayISO);render();};
const THEME_KEY='valencia-theme';
function applyTheme(mode){
 if(mode==='light')document.documentElement.setAttribute('data-theme','light');
 else document.documentElement.removeAttribute('data-theme');
 const b=document.getElementById('themeBtn'); if(b)b.textContent=mode==='light'?'Dark':'Light';
 try{localStorage.setItem(THEME_KEY,mode);}catch(e){}
}
let theme='dark';
try{const saved=localStorage.getItem(THEME_KEY); if(saved==='light'||saved==='dark')theme=saved;}catch(e){}
applyTheme(theme);
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);};
document.getElementById('langBtn').onclick=()=>{LANG=LANG==='en'&&T.pl?'pl':'en';document.getElementById('langBtn').textContent=LANG==='en'?'PL':'EN';render();};
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'){sel=clamp(addDays(sel,-1));render();}if(e.key==='ArrowRight'){sel=clamp(addDays(sel,1));render();}});
render();
console.log('valencia-daily ready', {sel, todayISO, days: days.length, bridge: bridge()});

})().catch(e=>{console.error(e);document.body.insertAdjacentHTML("afterbegin","<p style=\"padding:20px;color:#EF5350\">Load error: "+e.message+"</p>");});
</script>
