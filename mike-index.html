<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valencia 3:30 — Mike</title>
<meta name="theme-color" content="#0F1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valencia 3:30">
<style>
:root{color-scheme:dark;
 --bg:#0F1420;--surface:#161C2A;--surface2:#1E2636;--line:#2A3346;
 --ink:#E6EAF2;--gray:#A3ADBF;--muted:#78849A;
 --brand:#8FB3E8;--brandSolid:#1B2440;--primaryBg:#2E4A7D;--onBrand:#FFFFFF;
 --blue:#5AA9D6;--orange:#F0873F;
 --tint:#152234;--otint:#2A1D14;--guideBg:#231A12;
 --g:#4CAF50;--a:#E8A100;--r:#EF5350;
 --gbg:#14301A;--abg:#332608;--rbg:#331615;--gtx:#8BD98F;--atx:#F0C266;--rtx:#F19B98;
 --heroTxt:#DCE6F5}
[data-theme="light"]{color-scheme:light;
 --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F2F5F8;--line:#E2E8F0;
 --ink:#222830;--gray:#5A6470;--muted:#8A93A0;
 --brand:#21295C;--brandSolid:#21295C;--primaryBg:#21295C;--onBrand:#FFFFFF;
 --blue:#065A82;--orange:#D9642A;
 --tint:#E9F1F5;--otint:#FBEFE6;--guideBg:#FFF9F5;
 --g:#2E7D32;--a:#E8A100;--r:#C62828;
 --gbg:#E8F5E9;--abg:#FFF4D6;--rbg:#FDECEA;--gtx:#1B5E20;--atx:#7A5200;--rtx:#8E1B1B;
 --heroTxt:#21295C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:18px;color:var(--brand);font-weight:600;letter-spacing:.2px}
.brand b span{color:var(--orange)}
.brand small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;color:var(--ink);font-size:13px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primaryBg);color:var(--onBrand);border-color:var(--primaryBg)}
.btn.primary:disabled{opacity:.55;cursor:default}
select.btn{padding:6px 8px}
.hidden{display:none!important}

.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.weeknav .lbl{font-size:13px;color:var(--gray)}
.weeknav .lbl b{color:var(--ink);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;text-align:center;background:var(--surface);position:relative;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.day .dn{font-size:16px;font-weight:600;color:var(--ink);line-height:1}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day.past{background:var(--surface2);border-color:transparent}
.day.past .dn{color:var(--gray)}
.day.today{border:2px solid var(--brand);background:var(--surface)}
.day.today .dn{color:var(--brand)}
.day.sel{outline:2px solid var(--orange);outline-offset:1px}
.day.quality .dw{color:var(--orange)}
.day .cp{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--a)}
.day:hover{background:var(--tint)}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.rail{position:sticky;top:12px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card+.card{margin-top:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead h1{margin:0;font-size:20px;font-weight:600;color:var(--brand)}
.dhead .meta{font-size:13px;color:var(--gray)}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--gray);font-weight:600;letter-spacing:.2px}
.chip.q{background:var(--otint);color:var(--orange)}
.chip.rest{background:var(--tint);color:var(--blue)}
.chip.g{background:var(--gbg);color:var(--gtx)}.chip.a{background:var(--abg);color:var(--atx)}.chip.r{background:var(--rbg);color:var(--rtx)}
.chip.race{background:var(--primaryBg);color:var(--onBrand)}

.hero{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--tint)}
.hero.quality{background:var(--otint)}
.hero.race{background:var(--brandSolid)}
.hero .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue);font-weight:600}
.hero.quality .k{color:var(--orange)}
.hero.race .k{color:#F4B183}
.hero .t{font-size:17px;font-weight:600;margin:4px 0 6px;color:var(--heroTxt)}
.hero.race .t{color:#FFFFFF}
.hero .sub{font-size:14px;color:var(--gray)}
.hero.race .sub{color:#CADCFC}
.hero .kv div b{color:var(--ink)}
.hero.race .kv div,.hero.race .kv div b{color:#DCE6F5}
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px;font-size:13.5px}
.gym{margin-top:10px;border-radius:12px;padding:12px 16px;background:var(--surface2);font-size:14px}
.gym .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:600;margin-bottom:2px}

.sec{margin-top:14px}
.sec h2{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600}
.sec p{margin:0;font-size:14.5px;color:var(--ink)}
.guide{border-left:3px solid var(--orange);padding:8px 12px;background:var(--guideBg);border-radius:0 10px 10px 0;margin-top:8px;font-size:14px}
.guide b{color:var(--orange)}
.guide .row{display:grid;grid-template-columns:90px 1fr;gap:6px;margin:4px 0}
.guide .row span:first-child{color:var(--gray);font-size:12.5px}
.quote{border-left:3px solid var(--brand);padding:8px 12px;background:var(--tint);border-radius:0 10px 10px 0;margin-top:8px;font-size:14px;color:var(--ink)}
.quote .who{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);font-weight:600;margin-bottom:2px}

.live{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.live .st{font-size:12.5px;color:var(--muted)}
.live table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.live td{padding:4px 0;border-top:1px solid var(--line);color:var(--gray)}
.live td:last-child{text-align:right;font-weight:600;color:var(--ink)}
.actual{font-size:14px;margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.fb textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--surface2);color:var(--ink)}
.fb textarea::placeholder{color:var(--muted)}
.fb textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.fb .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.fb label{font-size:12px;color:var(--gray);display:block;margin-bottom:3px}
.fb input,.fb select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--surface2);color:var(--ink)}
.fb .act{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.fb .msg{font-size:13px}
.fb .msg.ok{color:var(--g)}.fb .msg.err{color:var(--r)}
.lock{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock p{margin:0;font-size:13.5px;color:var(--gray);flex:1 1 220px}
.lock input{flex:1 1 160px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface2);color:var(--ink)}
.relock{font-size:12px;color:var(--muted);margin-left:auto;cursor:pointer;background:none;border:0;text-decoration:underline}

.rail .card{padding:14px 16px}
.rail h3{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600}
.big{font-size:22px;font-weight:600;color:var(--brand)}
.big small{font-size:13px;color:var(--gray);font-weight:400}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:64px;margin-top:8px}
.bars .b{position:relative;background:var(--surface2);border-radius:4px 4px 0 0;height:100%}
.bars .b i{position:absolute;bottom:0;left:0;right:0;background:var(--brand);border-radius:4px 4px 0 0}
.bars .b.q i{background:var(--orange)}
.bars .b em{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-style:normal;margin-top:3px}
.cpl{list-style:none;margin:0;padding:0;font-size:13.5px}
.cpl li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.cpl li:first-child{border-top:0}
.cpl .d{color:var(--gray);min-width:52px;font-variant-numeric:tabular-nums}
.cpl li.next .d{color:var(--orange);font-weight:600}
details summary{cursor:pointer;font-size:13px;color:var(--blue);list-style:none;margin-top:6px}
details summary::-webkit-details-marker{display:none}
.pz{font-size:12.5px;margin-top:8px}
.pz div{padding:6px 0;border-top:1px solid var(--line)}
.pz b{display:block;color:var(--brand)}
.pz span{color:var(--gray)}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="brand"><b>VALENCIA <span>3:30</span></b><small id="countdown"></small></div>
  <div class="tools">
   <select id="jump" class="btn" aria-label="Jump to week"></select>
   <button class="btn" id="todayBtn">Today</button>
   <button class="btn" id="themeBtn" aria-label="Toggle light or dark theme">Light</button>
   <button class="btn hidden" id="langBtn" aria-label="Language">PL</button>
  </div>
 </header>

 <div class="weeknav">
  <button class="btn" id="prevW" aria-label="Previous week">‹</button>
  <div class="lbl" id="weekLbl"></div>
  <button class="btn" id="nextW" aria-label="Next week">›</button>
 </div>
 <div class="strip" id="strip"></div>

 <div class="grid">
  <main id="main"></main>
  <aside class="rail" id="rail"></aside>
 </div>
 <div class="foot" id="foot"></div>
</div>

async function weekActual(mon){ if(cache.week[mon])return cache.week[mon];

function guidanceFor(d){
 const r=d.run, out=[];
 const pick=k=>{const row=DATA.paces.find(p=>p.session.toLowerCase().includes(k.toLowerCase()));if(row&&!out.includes(row))out.push(row);};
 if(/hill/i.test(r))pick('Hill');
 if(/STRENGTH/i.test(r))pick('Hansons STRENGTH');
 if(/ladder/i.test(r)){pick('Marathon pace');pick('Ladder floats');}
 else if(/\bMP\b/.test(r)&&!/STRENGTH/i.test(r))pick('Marathon pace');

 if(/long run|\d{2}km long|race simulation|progressive/i.test(r))pick('Long runs');

 if(/RACE DAY/i.test(r))DATA.paces.filter(p=>/Race day/i.test(p.session)).forEach(p=>out.push(p));
 return out;
}

 if(d.rec)html+=`<div class="sec"><h2>${t('recovery')}</h2><p>${d.rec}</p></div>`;
 if(past||today){
  html+=`<div class="sec"><h2>${t('happened')}</h2><div class="live" id="live"><div class="st">${bridge()?t('liveLoading'):t('liveOff')}</div></div>`;
  if(d.actual)html+=`<div class="actual"><b>${t('logged')}:</b> ${d.actual}</div>`;
  const extra=[d.weather?`<span class="chip">${t('weather')}: ${d.weather}</span>`:'',d.sleep?`<span class="chip">${t('sleep')}: ${d.sleep}</span>`:'',d.alcohol?`<span class="chip ${d.alcohol.toLowerCase()==='none'?'g':'a'}">${t('alcohol')}: ${d.alcohol}</span>`:''].filter(Boolean).join('');
  if(extra)html+=`<div class="tags">${extra}</div>`;
  html+=`</div>`;
 }
 m.innerHTML=html;

}


async function renderRail(){
 const rail=document.getElementById('rail'); const mon=mondayOf(sel);
 const wd=[...Array(7)].map((_,i)=>byDate[addDays(mon,i)]).filter(Boolean);
 const planned=wd.reduce((a,d)=>a+(d.km||0),0);
 const nextCp=DATA.checkpoints.find(c=>c.date>=todayISO);
 rail.innerHTML=`<div class="card"><h3>${t('thisWeek')}</h3><div class="big"><span id="wkAct">…</span> <small>${t('of')} ${Math.round(planned)} ${t('kmU')} ${t('planned')}</small></div>
   <div class="bars" id="bars">${wd.map(d=>`<div class="b ${isQuality(d)?'q':''}" title="${d.dow}: ${d.km||0} km planned"><i style="height:0%"></i><em>${d.dow.slice(0,2)}</em></div>`).join('')}</div><div style="height:14px"></div></div>
  <div class="card"><h3>${t('checkpoints')}</h3><ul class="cpl">${DATA.checkpoints.map(c=>`<li class="${nextCp&&c.date===nextCp.date?'next':''}"><span class="d">${fmtShort(c.date)}</span><span>${c.label}</span></li>`).join('')}</ul></div>
  <div class="card"><h3>${t('goalT')}</h3><div class="big">3:30 <small>· 4:57/km</small></div>
   <div style="font-size:13px;color:var(--gray)">Halfway 1:44:00 · first 10 km capped 5:00-5:02</div>
   <div style="margin-top:10px;font-size:13px;color:var(--gray)">Stretch: <b style="color:var(--g)">3:27</b> if Oct 18 half ≤1:36</div></div>
  <div class="card"><details><summary>${t('pz')}</summary><div class="pz">${DATA.paces.map(p=>`<div><b>${p.session}</b><span>${p.pace}${p.hr?' · '+p.hr:''}</span><br><span>${p.notes}</span></div>`).join('')}</div></details></div>`;
 const maxKm=Math.max(...wd.map(d=>d.km||0),1);
 const bars=[...document.querySelectorAll('#bars .b i')];
 if(!bridge()){document.getElementById('wkAct').textContent=Math.round(planned);wd.forEach((d,i)=>{bars[i].style.height=(d.km/maxKm*100)+'%';bars[i].style.opacity=.55;});return;}
 try{const per=await weekActual(mon); let sum=0;
  wd.forEach((d,i)=>{const a=per[d.date]||0;sum+=a;const plannedH=(d.km/maxKm*100);const actH=Math.min(100,(a/maxKm*100));
   bars[i].style.height=actH+'%'; if(a===0&&d.date>=todayISO){bars[i].style.height=plannedH+'%';bars[i].style.opacity=.25;}});
  document.getElementById('wkAct').textContent=sum.toFixed(1);
 }catch(e){document.getElementById('wkAct').textContent='—';}
}

function renderJump(){
 const j=document.getElementById('jump'); const seen=new Map();
 for(const d of days){if(!seen.has(d.week))seen.set(d.week,d.date);}
 j.innerHTML=[...seen].map(([w,ds])=>`<option value="${ds}">${w} · ${fmtShort(ds)}</option>`).join('');
 j.value=[...seen].find(([w])=>w===byDate[sel]?.week)?.[1]||days[0].date;
 j.onchange=()=>{sel=j.value;render();};
}

function render(){
 const dtr=daysTo(todayISO,DATA.race);
 document.getElementById('countdown').textContent=dtr>0?`${dtr} ${t('daysToRace')}`:(dtr===0?t('raceDay'):'');
 document.getElementById('foot').textContent=t('foot');
 renderStrip(); renderMain(); renderRail(); renderJump();
 document.getElementById('todayBtn').textContent=t('today');
}
document.getElementById('prevW').onclick=()=>{sel=clamp(addDays(sel,-7));render();};
document.getElementById('nextW').onclick=()=>{sel=clamp(addDays(sel,7));render();};
document.getElementById('todayBtn').onclick=()=>{sel=clamp(todayISO);render();};
const THEME_KEY='valencia-theme';
function applyTheme(mode){
 if(mode==='light')document.documentElement.setAttribute('data-theme','light');
 else document.documentElement.removeAttribute('data-theme');
 const b=document.getElementById('themeBtn'); if(b)b.textContent=mode==='light'?'Dark':'Light';
 try{localStorage.setItem(THEME_KEY,mode);}catch(e){}
}
let theme='dark';
try{const saved=localStorage.getItem(THEME_KEY); if(saved==='light'||saved==='dark')theme=saved;}catch(e){}
applyTheme(theme);
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);};
document.getElementById('langBtn').onclick=()=>{LANG=LANG==='en'&&T.pl?'pl':'en';document.getElementById('langBtn').textContent=LANG==='en'?'PL':'EN';render();};
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'){sel=clamp(addDays(sel,-1));render();}if(e.key==='ArrowRight'){sel=clamp(addDays(sel,1));render();}});
render();
console.log('valencia-daily ready', {sel, todayISO, days: days.length, bridge: bridge()});

})().catch(e=>{console.error(e);document.body.insertAdjacentHTML("afterbegin","<p style=\"padding:20px;color:#EF5350\">Load error: "+e.message+"</p>");});
</script>
</body>
