<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valencia 3:15 — Plan at a glance</title>
<meta name="theme-color" content="#0F1420">
<style>
:root{color-scheme:light;
 --bg:#F2F5F8;--surface:#FFFFFF;--surface2:#F2F5F8;--line:#E2E8F0;--grid:#EDF1F5;
 --ink:#222830;--gray:#5A6470;--muted:#8A93A0;--brand:#21295C;--orange:#D9642A;
 --q:#eb6834;--l:#2a78d6;--e:#1baf7a;
 --good-bg:#E8F5E9;--good-tx:#1B5E20;--warn-bg:#FFF4D6;--warn-tx:#7A5200;--bad:#C62828;--bad-bg:#FDECEA;
 --trip:rgba(33,41,92,.10)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
 --bg:#0F1420;--surface:#161C2A;--surface2:#1E2636;--line:#2A3346;--grid:#202839;
 --ink:#E6EAF2;--gray:#A3ADBF;--muted:#78849A;--brand:#8FB3E8;--orange:#F0873F;
 --q:#d95926;--l:#3987e5;--e:#199e70;
 --good-bg:#14301A;--good-tx:#8BD98F;--warn-bg:#332608;--warn-tx:#F0C266;--bad:#EF5350;--bad-bg:#331615;
 --trip:rgba(143,179,232,.13)}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0F1420;--surface:#161C2A;--surface2:#1E2636;--line:#2A3346;--grid:#202839;
 --ink:#E6EAF2;--gray:#A3ADBF;--muted:#78849A;--brand:#8FB3E8;--orange:#F0873F;
 --q:#d95926;--l:#3987e5;--e:#199e70;
 --good-bg:#14301A;--good-tx:#8BD98F;--warn-bg:#332608;--warn-tx:#F0C266;--bad:#EF5350;--bad-bg:#331615;
 --trip:rgba(143,179,232,.13)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:600;color:var(--brand)} h1 span{color:var(--orange)}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tools{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.top{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:860px){.top{grid-template-columns:minmax(0,1fr) 300px}}
.ctitle{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;font-weight:600}
.hero{font-size:48px;font-weight:600;line-height:1;color:var(--ink)}
.hero small{font-size:14px;color:var(--gray);font-weight:400;margin-left:6px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-of-type{border-top:0}.kv span{color:var(--gray)}.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--gray);margin:0 0 12px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px 3px 0 0;display:inline-block}
.sw.o{background:transparent;border:1.5px solid var(--muted)}
.sw.trip{border-radius:3px;background:repeating-linear-gradient(45deg,var(--trip) 0 3px,transparent 3px 6px);border:1px solid var(--line)}
.anc{display:inline-block;width:12px;height:2px;background:var(--ink);border-radius:1px}
.gym{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--gray);border:1px solid var(--line);border-radius:3px;width:14px;height:13px;line-height:1}
.flag{color:var(--orange);font-size:12px;line-height:1}
/* block chart */
.block svg{display:block;overflow:visible}
/* weeks */
.week{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px;position:relative}
@media(min-width:860px){.week{grid-template-columns:150px minmax(0,1fr) 250px;align-items:stretch}}
.week.cur{border:2px solid var(--brand)}
.wl .wid{font-size:17px;font-weight:600}
.wl .wd{font-size:12px;color:var(--gray)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bdg{font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--gray);white-space:nowrap}
.bdg.best{background:var(--good-bg);color:var(--good-tx);border-color:transparent}
.bdg.prot{background:var(--warn-bg);color:var(--warn-tx);border-color:transparent}
.bdg.now{background:var(--brand);color:var(--surface);border-color:transparent}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;align-items:end;min-width:0}
.col{position:relative;display:flex;flex-direction:column;align-items:center;cursor:default;border-radius:8px;padding:2px 0 3px;outline:none}
.col:hover,.col:focus-visible{background:var(--surface2)}
.col.trip{background:repeating-linear-gradient(45deg,var(--trip) 0 4px,transparent 4px 8px)}
.col.clash{box-shadow:inset 0 0 0 2px var(--bad)}
.plot{position:relative;height:104px;width:100%;display:flex;justify-content:center;align-items:flex-end;border-bottom:1px solid var(--line)}
.bar{width:min(24px,62%);border-radius:4px 4px 0 0;position:relative}
.bar.plan{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1.5px var(--c);border-bottom:0}
.bar.done{background:var(--c)}
.bar.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.bar .cap{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gray);white-space:nowrap}
.fl{position:absolute;top:1px;left:50%;transform:translateX(-50%)}
.nobar{width:6px;height:6px;border-radius:50%;background:var(--line);margin-bottom:3px}
.dl{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.2;text-align:center}
.dl b{display:block;font-size:12px;color:var(--gray);font-weight:600}
.col.today .dl b{color:var(--surface);background:var(--brand);border-radius:6px;padding:0 4px}
.dl .a{display:block;width:12px;height:2px;margin:2px auto 0;background:var(--ink);border-radius:1px}
.dl .a.x{background:transparent}
.dk{font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums;margin-top:2px;min-height:14px}
.dg{margin-top:2px;min-height:14px}
.ws .tot{display:flex;align-items:baseline;gap:8px}
.ws .tot b{font-size:22px;font-weight:600}
.ws .tot span{font-size:12px;color:var(--gray)}
.meter{height:6px;background:var(--surface2);border-radius:3px;margin:6px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--muted);border-radius:3px}
.meter i.d{background:var(--brand)}
.ml{font-size:12.5px;margin:3px 0;display:flex;gap:6px;align-items:baseline}
.ml .dt{color:var(--muted);min-width:34px;font-variant-numeric:tabular-nums}
.cl{font-size:12px;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:4px 7px;margin-top:6px}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none}
.tip .h{font-weight:600;margin-bottom:3px}.tip .m{color:var(--gray)}
.foot{color:var(--muted);font-size:11.5px;margin-top:18px}
@media(max-width:420px){.plot{height:90px}.hero{font-size:40px}}
</style>
</head>

// block chart (SVG) — one bar per week, outline planned + solid done
function drawBlock(){
 const box=$("#block"),W=Math.max(300,Math.round(box.clientWidth||640)),H=W<480?140:185,pl=2,pr=38,pt=16,pb=34,n=weeks.length,max=80;

  `<div class="meter" aria-hidden="true"><i class="${w.loggedAny?"d":""}" style="width:${w.loggedAny?pct:0}%"></i></div>`+
  (w.win==="protected"&&!mss?`<div class="ml"><span class="dt">why</span><span>${esc(w.why)}</span></div>`:"")+mss+
  (wclash.length?`<div class="cl">⚠ Trip clashes with ${wclash.map(d=>d.dow+" "+TNAME[d.t].toLowerCase()).join(", ")} — move it before you go</div>`:"")+
  `</div></section>`;
});
$("#weeks").innerHTML=html;
$("#foot").textContent="Built from the Daily Plan spreadsheet. Km under each day = planned (future) or done (logged); ✕ = planned but not run. Hover or tap a day for the session.";

// tooltips
const tip=$("#tip");
function place(e){const x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);
 const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;
 tip.style.left=Math.max(8,L)+"px";tip.style.top=Math.max(8,T)+"px";}
function bindTip(el,fn){
 el.addEventListener("pointerenter",e=>{tip.innerHTML=fn();tip.style.display="block";place(e)});
 el.addEventListener("pointermove",place);
 el.addEventListener("pointerleave",()=>tip.style.display="none");
 el.addEventListener("focus",()=>{tip.innerHTML=fn();tip.style.display="block";const r=el.getBoundingClientRect();place({clientX:r.right,clientY:r.top})});
 el.addEventListener("blur",()=>tip.style.display="none");
}
document.querySelectorAll(".col[data-i]").forEach(el=>{const d=days[+el.dataset.i];
 bindTip(el,()=>{const trip=tripOf[d.d];
  let s=`<div class="h">${d.dow} ${fmt(d.d)} · ${TNAME[d.t]}${d.anchor?" · fixed":""}</div>`;
  if(d.run)s+=`<div>${esc(d.run.length>110?d.run.slice(0,107)+"…":d.run)}</div>`;
  if(d.km>0)s+=`<div class="m">planned ${n1(d.km)} km${d.logged&&d.act!==null?" · done "+n1(d.act)+" km":""}</div>`;
  if(d.gym)s+=`<div class="m">Gym: ${esc(d.gym.length>70?d.gym.slice(0,67)+"…":d.gym)}</div>`;
  for(const m of d.ms)s+=`<div>⚑ ${esc(m)}</div>`;
  if(trip)s+=`<div${d.anchor?' style="color:var(--bad)"':""}>${d.anchor?"⚠ ":""}Trip: ${esc(trip)}</div>`;
  return s;});});
document.addEventListener("scroll",()=>tip.style.display="none",{passive:true});
const cw=document.querySelector(".week.cur");if(cw&&location.hash!=="#top")cw.scrollIntoView({block:"center"});
})();
</script>
</body>
